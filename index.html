<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하루책 시연</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1f24;--mute:#6b7280;--line:#e3e1da;--acc:#0f766e;--acc-ink:#fff;--soft:#e6f4f1;
--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef3c7;--chip:#eef2f1}
@media (prefers-color-scheme:dark){:root{--bg:#15171b;--card:#1e2126;--ink:#eceef1;--mute:#9aa3ae;--line:#30353d;--soft:#12302c;
--acc:#2dd4bf;--acc-ink:#06201d;--ok:#4ade80;--okbg:#12301d;--bad:#f87171;--badbg:#3a1616;--warn:#fbbf24;--warnbg:#3a2c0a;--chip:#2a2f36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0}
#lang{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
header a{color:var(--acc)}
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;max-width:1240px;margin:0 auto;padding:16px}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
.rail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;align-self:start;position:sticky;top:12px}
@media (max-width:860px){.rail{position:static;display:flex;overflow-x:auto;gap:4px}.rail h3{display:none}.rail button{white-space:nowrap}}
.rail h3{font-size:12px;color:var(--mute);margin:12px 8px 4px;font-weight:500}
.rail button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:6px 8px;border-radius:8px;cursor:pointer}
.rail button.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
.rail button .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--chip);color:var(--ink);font-size:12px;display:grid;place-items:center}
.rail button.done .n{background:var(--okbg);color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;min-width:0}
.card h2{margin:0 0 6px;font-size:21px}.card h3{margin:16px 0 6px;font-size:14px;color:var(--mute)}
.lead{font-size:16px}.why{background:var(--soft);border-radius:10px;padding:10px 14px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.b,select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
button.b{cursor:pointer}button.b.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.b:disabled{opacity:.45;cursor:not-allowed}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:12px}tr.me td{background:var(--soft);font-weight:600}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--chip);font-size:13px}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:var(--warnbg);color:var(--warn)}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.chain div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:120px}
.chain div small{display:block;color:var(--mute);font-size:12px}.chain i{align-self:center;color:var(--mute);font-style:normal}
.code{display:flex;flex-wrap:wrap;gap:4px;font-family:Consolas,monospace;font-size:20px}
.code span{border:1px solid var(--line);border-radius:8px;padding:4px 8px;text-align:center}
.code small{display:block;font:12px/1.3 "Malgun Gothic",sans-serif;color:var(--mute)}
.note{padding:12px 14px;border-radius:10px;margin:10px 0;font-weight:600}
.note.ok{background:var(--okbg);color:var(--ok)}.note.bad{background:var(--badbg);color:var(--bad)}.note.warn{background:var(--warnbg);color:var(--warn)}
.mono{font-family:Consolas,monospace}.mute{color:var(--mute)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
/* 여정 지도: 책이 지나가는 길 */
.journey{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:14px 10px 10px;position:relative}
.journey .stop{flex:1;min-width:66px;text-align:center;position:relative;font-size:12px;color:var(--mute);cursor:pointer;border:0;background:none;font-family:inherit}
.journey .stop::before{content:"";position:absolute;top:21px;left:-50%;width:100%;height:4px;background:var(--line);z-index:0}
.journey .stop:first-child::before{display:none}
.journey .stop.past::before,.journey .stop.now::before{background:var(--acc)}
.journey .ico{position:relative;z-index:1;display:grid;place-items:center;width:44px;height:44px;margin:0 auto 4px;border-radius:50%;background:var(--card);border:3px solid var(--line);font-size:22px;transition:transform .3s}
.journey .past .ico{border-color:var(--acc)}
.journey .now .ico{border-color:var(--acc);background:var(--soft);transform:scale(1.25)}
.journey .now{color:var(--ink);font-weight:600}
.journey .now .ico::after{content:"📘";position:absolute;top:-16px;right:-12px;font-size:18px;animation:bob 1.2s ease-in-out infinite}
/* 장면 그림 */
.scene{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;background:var(--soft);border-radius:14px;padding:18px 10px;margin:10px 0;min-height:110px;position:relative;overflow:hidden}
.scene .it{text-align:center;min-width:64px}.scene .it b{display:block;font-size:40px;line-height:1.15;font-weight:400}
.scene .it small{display:block;font-size:12px;color:var(--mute)}
.scene .arrow{font-size:20px;color:var(--acc);animation:nudge 1.1s ease-in-out infinite}
.scene .pop b{animation:pop 1.6s ease-in-out infinite}.scene .spin b{animation:wiggle 1s ease-in-out infinite}
.scene .drive b{animation:drive 2.4s ease-in-out infinite}.scene .feed b{animation:feed 1.4s ease-in-out infinite}
.scene .dim b{opacity:.3;filter:grayscale(1)}
.tiles{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:8px 0}
.tile{border-radius:10px;padding:6px 10px;text-align:center;font-size:12px;min-width:70px;border:2px solid transparent;background:var(--chip)}
.tile b{display:block;font-size:24px;font-weight:400}.tile.me{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.tile.slip{background:none;border:2px dashed var(--line);color:var(--mute)}
@keyframes bob{50%{transform:translateY(-5px)}}@keyframes nudge{50%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.18)}}@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes drive{0%{transform:translateX(-26px)}50%{transform:translateX(26px)}100%{transform:translateX(-26px)}}
@keyframes feed{0%{transform:translateY(-10px);opacity:.2}60%{transform:translateY(0);opacity:1}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.scene *,.journey *{animation:none!important;transition:none!important}}
label{display:inline-flex;gap:6px;align-items:center}
/* 실사 장면 사진(AI 생성 — 지어낸 사람·장소) */
.photo{position:relative;margin:10px 0 6px;border-radius:14px;overflow:hidden;background:var(--chip);aspect-ratio:3/2;max-height:460px}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.photo figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 12px;color:#fff;font-size:15px;line-height:1.45;
  background:linear-gradient(transparent,rgba(0,0,0,.72));text-shadow:0 1px 2px rgba(0,0,0,.5)}
.photo figcaption b{display:block;font-size:12px;opacity:.85;font-weight:500;letter-spacing:.02em}
.photo .ai{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.scene.mini{min-height:0;padding:10px;gap:4px}.scene.mini .it b{font-size:26px}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.flow button{border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;background:var(--card);color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.flow button:hover{border-color:var(--acc)}
.flow img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.flow span{display:block;padding:6px 8px;font-size:13px;line-height:1.35}.flow span small{display:block;color:var(--mute);font-size:11px}
/* 발표 모드: 전체 화면, 키보드로 넘긴다 */
.showbtn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
#bar{display:none}
body.show header,body.show .rail{display:none}
body.show .wrap{grid-template-columns:1fr;max-width:1500px;padding:10px 24px 90px}
body.show .card{font-size:17px}body.show .card h2{font-size:28px}
body.show .photo{max-height:58vh;aspect-ratio:auto;height:58vh}
body.show .photo figcaption{font-size:19px;padding:40px 24px 18px}
body.show .nav{display:none}
body.show #bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;gap:14px;align-items:center;padding:10px 24px;
  background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
#bar .prog{flex:1;height:6px;background:var(--chip);border-radius:99px;overflow:hidden}#bar .prog i{display:block;height:100%;background:var(--acc);transition:width .4s}
#bar .hint{color:var(--mute);font-size:14px;min-width:260px;text-align:right}#bar .hint b{color:var(--ink)}
#bar .count{font-variant-numeric:tabular-nums;color:var(--mute)}
body.busy #bar .hint::after{content:" …";animation:bob 1s infinite}
.fadein{animation:fadein .35s ease-out}@keyframes fadein{from{opacity:0}to{opacity:1}}   /* 위치는 움직이지 않는다(손가락이 어긋나지 않게) */
/* 나레이션 자동 시연: 손가락·말풍선·강조 */
.playbtn{background:#e11d48;color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
.spot{position:relative;z-index:5;outline:3px solid var(--acc);outline-offset:4px;border-radius:10px;animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(15,118,110,.45)}100%{box-shadow:0 0 0 18px rgba(15,118,110,0)}}
#finger{position:absolute;z-index:30;font-size:46px;line-height:1;pointer-events:none;display:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
#finger.move{transition:left .45s ease-out,top .45s ease-out}
#finger.show{animation:fingerIn .25s ease-out}@keyframes fingerIn{from{opacity:0}to{opacity:1}}
#finger.show.r,#finger.show.d{animation:fingerIn .25s ease-out,var(--poke) .8s ease-in-out .25s infinite}
#finger.r{--poke:pokeR;animation:pokeR .8s ease-in-out infinite}#finger.d{--poke:pokeD;animation:pokeD .8s ease-in-out infinite}
@keyframes pokeR{50%{transform:translateX(10px)}}@keyframes pokeD{50%{transform:translateY(10px)}}
#bubble{position:fixed;z-index:31;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);opacity:0;width:min(920px,calc(100vw - 32px));
  display:flex;gap:14px;align-items:flex-start;background:var(--card);color:var(--ink);border:2px solid var(--acc);border-radius:18px;
  padding:14px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:opacity .3s,transform .3s;pointer-events:none}
#bubble.on{opacity:1;transform:translateX(-50%) translateY(0)}
#bubble::after{content:"";position:absolute;left:46px;top:-14px;border:12px solid transparent;border-bottom-color:var(--acc);border-top:0}
#bubble .who{flex:none;width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:30px;position:relative}
#bubble .who i{position:absolute;right:-4px;bottom:-2px;display:flex;gap:2px;align-items:flex-end;height:16px}
#bubble .who i b{width:3px;background:var(--acc);border-radius:2px;animation:wave .9s ease-in-out infinite}
#bubble .who i b:nth-child(2){animation-delay:.15s}#bubble .who i b:nth-child(3){animation-delay:.3s}
@keyframes wave{0%,100%{height:4px}50%{height:15px}}
#bubble.paused .who i b{animation:none;height:4px}
#bubble p{margin:0;font-size:20px;line-height:1.55}#bubble small{display:block;color:var(--mute);font-size:13px;margin-top:4px}
body.playing .photo img{animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.09) translate(-2%,-1.5%)}}
body.playing .wrap{padding-bottom:230px}
#bar .ctl{display:none}body.playing #bar .ctl{display:inline-flex}
@media (prefers-reduced-motion:reduce){body.playing .photo img,#finger,.spot{animation:none!important}}
#start{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(0,0,0,.45)}
#start.on{display:grid}
#start .box{background:var(--card);color:var(--ink);border-radius:16px;padding:22px;width:min(440px,calc(100vw - 32px));box-shadow:0 20px 50px rgba(0,0,0,.3)}
#start h3{margin:0 0 6px;font-size:19px}#start p{margin:0 0 14px;color:var(--mute);font-size:14px}
#start button{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
#start button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
#start button small{display:block;font-weight:400;opacity:.8;font-size:13px}
</style>
</head>
<body>
<header><h1 data-i18n="h1">하루책 시연 — 회원 가입부터 학생 손에 닿기까지</h1><span class="mute" data-i18n="fake">모든 이름·지점은 지어낸 것입니다</span><span style="flex:1"></span>
  <select id="lang" title="나레이션 언어 · Narration language · 旁白語言" aria-label="Narration language"><option value="ko">한국어</option><option value="en">English</option><option value="zh-TW">繁體中文</option></select>
  <button class="playbtn" id="play-on" title="나레이션과 함께 처음부터 끝까지 자동으로 진행합니다(스페이스: 일시정지)">🔊 시연 시작</button>
  <button class="showbtn" id="show-on" title="전체 화면으로 → ← 키로 직접 넘깁니다"><span data-i18n="show">▶ 전체 화면(직접 넘기기)</span></button><a class="live" href="/" data-i18n="ops">운영 화면으로</a></header>
<div id="start" role="dialog" aria-modal="true" aria-labelledby="start-title"><div class="box">
  <div data-i18n="start"><h3 id="start-title">🔊 나레이션 시연</h3><p>전체 화면으로 바뀌고 나레이션과 함께 끝까지 저절로 진행합니다. 스페이스로 멈추고, Esc 로 끝냅니다.</p></div>
  <button class="p" data-start="fresh" data-i18n="fresh">처음부터 시작<small>지금 DB를 시연 데이터로 되돌리고 1단계부터</small></button>
  <button data-start="resume" data-i18n="resume">지금 상태에서 이어서<small>데이터는 그대로, 지금 보고 있는 단계부터</small></button>
  <button data-start="cancel" data-i18n="cancel">취소</button></div></div>
<div id="finger" aria-hidden="true">👉</div>
<div id="bubble" aria-live="polite"><span class="who">🧑‍🏫<i><b></b><b></b><b></b></i></span><div><p id="bubble-text"></p><small id="bubble-sub"></small></div></div>
<div class="wrap"><nav class="rail" id="rail"></nav><main id="main"></main></div>
<div id="bar"><button class="b" id="bar-prev">←</button><span class="count" id="bar-count"></span><div class="prog"><i id="bar-prog"></i></div>
  <span class="hint" id="bar-hint"></span>
  <button class="b ctl" id="bar-play" title="스페이스">⏸ 일시정지</button>
  <select class="ctl" id="bar-rate" title="나레이션 속도"><option value="1">1.0배</option><option value="1.15" selected>1.15배</option><option value="1.3">1.3배</option><option value="1.5">1.5배</option></select>
  <button class="b p" id="bar-next">→</button><button class="b" id="show-off" title="발표 모드 끝내기(Esc)">✕</button></div>
<script src="demo-i18n.js"></script>
<script src="replay.js"></script>
<script>
const $ = q => document.querySelector(q);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => Number(v || 0).toLocaleString("ko-KR");
// api: 서버 응답을 지금 언어로 바꿔 돌려준다(demo-i18n.js 의 trData). apiRaw: 원문 그대로.
async function api(path, body){ return trData(await apiRaw(path, body)); }
async function apiRaw(path, body){
  if(window.HARU_REPLAY) return window.HARU_REPLAY(path, body);   // 공개용 정적 시연: 녹화한 응답을 돌려준다
  const res = await fetch(path, body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const data = await res.json();
  if(res.status === 401){ location.href = "/"; throw new Error("로그인이 필요합니다 — 운영 화면에서 로그인한 뒤 다시 여세요."); }
  if(!res.ok) throw new Error(data.error || res.statusText); return data;
}
const KEY = "harubook-demo";
let ctx = {step:0, done:{}}; try{ ctx = JSON.parse(localStorage.getItem(KEY)) || ctx; }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(ctx)); }catch(e){} };
let META, msg = null;
const DOW = ["월","화","수","목","금","토","일"];
const dayOf = i => L(DOW[i], ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][i], ["週一","週二","週三","週四","週五","週六","週日"][i]);
const chip = (label, kind="") => `<span class="chip ${kind}">${esc(label)}</span>`;
const stat = s => chip(META.status[s] || s, ({delivered:"ok",handed:"ok",received:"ok",shipped:"ok",packed:"ok",bound:"ok",printed:"ok",defect:"bad"})[s] || "");
const chain = c => `<div class="chain"><div><small>🧒 ${L("학생","Student","學生")}</small>${esc(c.name)} <span class="mute">${esc(c.grade)}</span><small class="mono">${c.code}</small></div><i>→</i>
  <div><small>👩‍🏫 ${L("담당 교사","Teacher","負責老師")}</small>${esc(c.teacher_name)}<small>${L(`${dayOf(c.visit_dow)}요일 방문`, `Visits on ${dayOf(c.visit_dow)}`, `${dayOf(c.visit_dow)}到府`)}</small></div><i>→</i>
  <div><small>🏢 ${L("지점","Branch","分處")}</small>${esc(c.branch_name)}<small class="mono">${c.branch_code}</small></div><i>→</i>
  <div><small>🗺️ ${L("광역","Region","區域")}</small>${esc(c.region_name)}</div><i>→</i>
  <div><small>🚚 ${L("배송 권역(노선)","Delivery route","配送路線")}</small>${esc(c.route)}<small>${L(`${c.stop_seq}번째로 내림`, `Stop ${c.stop_seq}`, `第 ${c.stop_seq} 站卸貨`)}</small></div></div>`;
// 장면 그림: [이모지, 설명, 움직임(pop·spin·drive·feed·dim)] 을 화살표로 잇는다. "|" 는 화살표 없는 띄움.
const scene = (...items) => `<div class="scene mini" aria-hidden="true">${items.map((it, i) => it === "|" ? `<span style="width:22px"></span>` :

  if(s) return `<p class="lead">${L(`<b>${esc(s.name)}</b> 학생이 가입했습니다. 교사 한 명을 정했을 뿐인데 지점·광역·배송 권역까지 한 줄로 이어졌습니다.`,
      `<b>${esc(s.name)}</b> has signed up. Choosing just one teacher linked the branch, region and delivery route in one chain.`,
      `<b>${esc(s.name)}</b> 已入會。只選定了一位老師，分處、區域和配送路線就串成了一條線。`)}</p>${chain(s.chain)}
    <div class="why">${L(`이 한 줄이 나중에 <b>인쇄 순서</b>가 됩니다. 권역 → 지점 → 교사 → 방문 요일 → 학생 순으로 찍기 때문에, 찍혀 나온 책을 다시 분류할 필요가 없습니다.`,
      `This chain later becomes the <b>print order</b>. Books are printed by route → branch → teacher → visit day → student, so printed books never need re-sorting.`,
      `這條線之後就是<b>印刷順序</b>。依路線 → 分處 → 老師 → 到府星期 → 學生的順序印刷，印好的書就不必再分揀。`)}</div>`;
  return `<p class="lead">${L("새 학생이 들어왔습니다. 이름과 학년, 배울 과목과 시작할 호, 담당 교사와 방문 요일을 정합니다.","A new student joins. We set the name and grade, the subjects and starting issues, the teacher and the visit day.","有新學生加入。設定姓名與年級、要學的科目與開始期數、負責老師與到府星期。")}</p>
  <div class="row"><label>${L("이름","Name","姓名")} <input id="j-name" value="${L("한지우","Han Jiu","Han Jiu")}" style="width:110px"></label><label>${L("학년","Grade","年級")} <select id="j-grade">${["7세","초1","초2","초3","초4","초5","초6"].map(g=>`<option value="${g}" ${g==="초2"?"selected":""}>${esc(trStr(g))}</option>`).join("")}</select></label>
    <label>${L("방문 요일","Visit day","到府星期")} <select id="j-dow">${DOW.slice(0,6).map((d,i)=>`<option value="${i}" ${i===2?"selected":""}>${dayOf(i)}</option>`).join("")}</select></label></div>
  <div class="row" style="margin-top:8px"><label>${L("담당 교사","Teacher","負責老師")} <select id="j-teacher">${org.map(t=>`<option value="${t.id}">${esc(t.route)} › ${esc(t.branch_name)} › ${esc(t.name)}</option>`).join("")}</select></label></div>
  <h3>${L("배울 과목과 시작 호","Subjects and starting issue","科目與開始期數")}</h3>
  <div class="row">${subjects.map(sb=>`<label><input type="checkbox" data-subj="${sb.id}" ${["MAT","KOR"].includes(sb.code)?"checked":""}>${esc(sb.name)} ${L("","from No.","從第")} <input type="number" data-seq="${sb.id}" value="${sb.code==="MAT"?3:5}" min="1" max="${sb.units}" style="width:64px">${L("호부터",""," 期開始")}</label>`).join("")}</div>
  <div class="row" style="margin-top:12px"><button class="b p" data-act="join">${L("가입 처리","Sign up","辦理入會")}</button></div>`; },
  acts:{ async join(){ const enrollments = [...document.querySelectorAll("[data-subj]:checked")].map(c => ({subject_id:Number(c.dataset.subj), next_seq:Number($(`[data-seq="${c.dataset.subj}"]`).value)}));
    const r = await api("/api/students", {name:$("#j-name").value, grade:$("#j-grade").value, visit_dow:Number($("#j-dow").value), teacher_id:Number($("#j-teacher").value), enrollments});
    ctx.sid = r.id; ctx.done[1] = true; msg = ["ok", L(`${r.name} 학생을 등록했습니다 (${r.code}).`, `Signed up ${r.name} (${r.code}).`, `已登錄 ${r.name}（${r.code}）。`)]; } } },

{ch:"회원과 교재 준비", title:"개별 진도", async view(){
  const s = await student(); if(!s) return needStudent();
  return `<p class="lead">${L(`학생마다 과목별로 <b>다음에 나갈 호</b>와 <b>주당 분량</b>이 따로 있습니다. 같은 학년이어도 진도는 모두 다릅니다.`,
    `Each student has a <b>next issue</b> and a <b>weekly pace</b> for every subject. Even in the same grade, everyone's progress differs.`,
    `每位學生的每個科目都有各自的<b>下一期</b>與<b>每週份量</b>。即使同年級，進度也都不同。`)}</p>
  <div class="scroll"><table><tr><th>${L("과목","Subject","科目")}</th><th>${L("다음 주에 나갈 호","Issues for next week","下週的期數")}</th><th>${L("쪽","Pages","頁數")}</th><th>${L("주당","Per week","每週")}</th><th>${L("진도","Progress","進度")}</th></tr>${s.plan.map(e=>`<tr><td>${esc(e.subject_name)}</td><td>${e.units.map(u=>esc(u.title)).join(", ")||`<span class="mute">${L("없음","None","無")}</span>`}</td><td>${e.units.reduce((a,u)=>a+u.pages,0)}</td><td>${L(`${e.units_per_week}호`, `${e.units_per_week}`, `${e.units_per_week} 期`)}</td><td>${L(`${e.next_seq} / ${e.last_seq}호`, `${e.next_seq} / ${e.last_seq}`, `${e.next_seq} / ${e.last_seq} 期`)}</td></tr>`).join("")}</table></div>
  <div class="why">${L(`교사는 <b>컷오프(주문 마감) 전까지</b> 진도를 바꿀 수 있습니다: 복습(되돌리기), 건너뛰기, 주당 분량, 휴회, 중단. 바꾼 내용은 누가 언제 바꿨는지 모두 남습니다.`,
    `Teachers can change progress <b>until the cutoff (order close)</b>: review (go back), skip, weekly pace, pause, stop. Every change records who made it and when.`,
    `老師在<b>截單（訂單截止）前</b>都可以調整進度：複習（退回）、跳過、每週份量、暫停、停止。誰在何時修改都會留下紀錄。`)}</div>
  <div class="row"><button class="b" data-act="pace">${L("수학을 주 2호로 늘려 보기","Raise math to 2 issues a week","把數學調成每週 2 期")}</button><button class="b" data-act="back">${L("수학을 주 1호로 되돌리기","Set math back to 1 a week","把數學改回每週 1 期")}</button></div>`; },
  acts:{ async pace(){ const s = await student(); const e = s.plan.find(x => x.subject_code === "MAT") || s.plan[0]; await api(`/api/enrollments/${e.id}/adjust`, {kind:"pace", value:2, actor:"시연"}); ctx.done[2] = true; msg = ["ok", L(`${e.subject_name} 주당 분량을 2호로 바꿨습니다. 위 표가 바뀐 것을 보세요.`, `${e.subject_name} is now 2 issues a week. See the table above change.`, `${e.subject_name}已改為每週 2 期。請看上方表格的變化。`)]; },
    async back(){ const s = await student(); const e = s.plan.find(x => x.subject_code === "MAT") || s.plan[0]; await api(`/api/enrollments/${e.id}/adjust`, {kind:"pace", value:1, actor:"시연"}); ctx.done[2] = true; msg = ["ok", L(`${e.subject_name} 주당 분량을 1호로 되돌렸습니다.`, `${e.subject_name} is back to 1 issue a week.`, `${e.subject_name}已改回每週 1 期。`)]; } } },

{ch:"회원과 교재 준비", title:"교재 원고", async view(){
  const s = await student(); if(!s) return needStudent();
  const units = s.plan.flatMap(e => e.units);
  return `<p class="lead">${L(`교재 원고는 <b>호(한 주 분량)마다 PDF 하나</b>로 들어옵니다. 책을 만들 때 그 PDF의 1쪽, 2쪽…을 꺼내 얹기 때문에 미리 쪽 단위로 쪼개 둘 필요가 없습니다.`,
    `Content arrives as <b>one PDF per issue (one week's work)</b>. Pages 1, 2… are pulled from that PDF when the book is built, so nothing needs to be split into pages in advance.`,
    `教材原稿<b>每一期（一週份量）是一個 PDF</b>。製書時從該 PDF 取出第 1、2 頁…置入，所以不必事先拆成單頁。`)}</p>
  <div class="scroll"><table><tr><th>${L("이 학생이 다음에 받을 호","Issues this student gets next","這位學生下次會拿到的期數")}</th><th>${L("쪽","Pages","頁數")}</th><th>${L("원고","Content","原稿")}</th></tr>${units.map(u=>`<tr><td>${esc(u.title)}</td><td>${u.pages}</td><td>${u.asset_path?chip(L("원고 등록됨","Content attached","已登錄原稿"),"ok"):chip(L("아직 없음 — 자리표시 쪽으로 나옴","Not yet: placeholder pages are used","尚未登錄：以佔位頁輸出"))}</td></tr>`).join("")}</table></div>
  <div class="why">${L(`쪽수는 <b>원고가 기준</b>입니다. 원고를 붙이면 호의 쪽수가 원고에 맞춰집니다. 글꼴은 윤곽선으로 바뀐 상태로 받고, 학생 이름 같은 내용은 인쇄 때 따로 얹습니다.`,
    `<b>The content file sets the page count.</b> Attaching it adjusts the issue's page count to match. Fonts arrive outlined, and things like the student's name are added at print time.`,
    `頁數<b>以原稿為準</b>。附上原稿後，該期頁數會跟著原稿調整。字型以轉外框的狀態接收，學生姓名等內容在印刷時另外套印。`)}</div>
  <div class="row"><button class="b p" data-act="assets" ${units.every(u=>u.asset_path)?"disabled":""}>${L("이 호들에 견본 원고 붙이기","Attach sample content to these issues","為這些期數附上範例原稿")}</button><span class="mute">${L("실제 원고 대신 견본 PDF를 만들어 붙입니다(호마다 1~2초).","Makes and attaches sample PDFs instead of real content (1–2 s per issue).","以範例 PDF 代替實際原稿（每期約 1～2 秒）。")}</span></div>`; },
  acts:{ async assets(){ const s = await student(); let n = 0; for(const u of s.plan.flatMap(e => e.units)) if(!u.asset_path){ await api(`/api/units/${u.id}/sample`, {}); n++; } ctx.done[3] = true; msg = ["ok", L(`견본 원고 ${n}개를 붙였습니다.`, `Attached ${n} sample files.`, `已附上 ${n} 份範例原稿。`)]; } } },

{ch:"주문에서 인쇄까지", title:"컷오프 — 주문 확정과 코드", async view(){
  const s = await student(); if(!s) return needStudent();
  if(!ctx.c1) return `<p class="lead">${L(`매주 정해진 시각(방문 주 ${META.cutoff.days_before_week}일 전 ${META.cutoff.hour}시)에 <b>컷오프</b>를 합니다. 그 순간의 진도대로 학생마다 그 주에 받을 책이 확정됩니다.`,
      `Every week at a set time (${META.cutoff.days_before_week} days before the visit week, ${META.cutoff.hour}:00) we run the <b>cutoff</b>. Each student's book for that week is fixed by their progress at that moment.`,
      `每週在固定時間（到府週的 ${META.cutoff.days_before_week} 天前 ${META.cutoff.hour} 點）進行<b>截單</b>。依當下的進度，確定每位學生該週要拿到的書。`)}</p>
    <div class="why">${L("확정된 책은 바뀌지 않습니다. 컷오프 뒤에 바꾼 진도는 다음 주에 반영됩니다. 그래야 공장이 흔들리지 않습니다.","Fixed books don't change. Progress changed after the cutoff applies the following week, so the factory plan stays stable.","已確定的書不會再變。截單後修改的進度會反映在下一週，工廠才不會被打亂。")}</div>
    <div class="row"><button class="b p" data-act="freeze">${L("다음 주 사이클을 열고 주문 확정","Open next week's cycle and fix orders","開啟下週週期並確定訂單")}</button></div>`;
  const b = await bookOf(ctx.c1), st = ctx.c1stats;
  return `<p class="lead">${L(`<b>${ctx.c1code}</b> 주문이 확정됐습니다. 학생 ${num(st.students)}명에게 책 ${num(st.books)}권, 모두 ${num(st.pages)}쪽입니다.`,
    `Orders for <b>${ctx.c1code}</b> are fixed: ${num(st.books)} books for ${num(st.students)} students, ${num(st.pages)} pages in total.`,
    `<b>${ctx.c1code}</b> 的訂單已確定：${num(st.students)} 位學生、${num(st.books)} 本書，共 ${num(st.pages)} 頁。`)}</p>
  <h3>${L(`${esc(s.name)} 학생의 책`, `${esc(s.name)}'s book`, `${esc(s.name)} 的書`)}</h3>${bookCard(b)}
  <div class="why">${L(`여러 과목을 <b>한 권으로 합칩니다</b>. 중철 제본이라 쪽수는 4의 배수여야 해서, 모자라면 메모 쪽을 넣어 맞춥니다.`,
    `Several subjects are <b>combined into one book</b>. Saddle stitching needs a multiple of 4 pages, so note pages fill any gap.`,
    `多個科目<b>合成一本書</b>。騎馬釘裝訂的頁數必須是 4 的倍數，不足時加入筆記頁補齊。`)}</div>
  <h3>${L("주문이 코드가 됩니다","The order becomes a code","訂單變成代碼")}</h3>${b?anatomy(b.code):""}
  <p class="mute">${L("이 코드가 책 표지와 뒤표지에 QR 코드로 찍히고, 공장에서 학생 손까지 모든 단계에서 스캔됩니다. 코드에는 개인정보가 없습니다. 검증 숫자가 있어 잘못 읽으면 바로 걸러집니다.",
    "This code is printed as a QR code on the front and back covers and scanned at every step from the factory to the student. It holds no personal data, and its check digit catches misreads.",
    "這個代碼以 QR 碼印在封面與封底，從工廠到學生手上的每個環節都會掃描。代碼不含個人資料，並有檢查碼，讀錯時會立即被擋下。")}</p>`; },
  acts:{ async freeze(){ const st = await openAndFreeze("c1"); ctx.done[4] = true; msg = ["ok", L(`책 ${num(st.books)}권을 확정했습니다.`, `Fixed ${num(st.books)} books.`, `已確定 ${num(st.books)} 本書。`)]; } } },

{ch:"주문에서 인쇄까지", title:"생산 계획 — 인쇄 순서가 분류 순서", async view(){
  if(!ctx.c1) return need(false, L("먼저 5단계에서 주문을 확정해 주세요.","First fix the orders in step 5.","請先在第 5 步確定訂單。"));
  const b = await bookOf(ctx.c1);
  if(!b || !b.batch_id) return `<p class="lead">${L(`확정된 책을 <b>배송 권역 → 지점(내리는 순서) → 교사 → 방문 요일 → 학생</b> 순으로 줄 세웁니다. 이 순서대로 찍으면 제본기에서 나오는 책이 이미 교사별로 모여 있습니다.`,
      `Fixed books are lined up by <b>route → branch (drop order) → teacher → visit day → student</b>. Printed in this order, books leave the binder already grouped by teacher.`,
      `把確定的書依<b>路線 → 分處（卸貨順序）→ 老師 → 到府星期 → 學生</b>排序。照這個順序印，從裝訂機出來的書就已經依老師分好。`)}</p>
    <div class="why">${L(`예전에는 다 찍은 뒤에 사람이 학생별·교사별로 모았습니다. 이제는 <b>모으는 일이 없고, 교사 경계에서 끊어 담기만</b> 합니다.`,
      `Before, people gathered books by student and teacher after printing. Now <b>there is no gathering; you just cut where the teacher changes</b>.`,
      `過去是印完後由人工依學生、老師彙整。現在<b>不必彙整，只要在換老師的地方分開裝</b>。`)}</div>
    <div class="row"><button class="b p" data-act="plan">${L("생산 계획 세우기","Make the production plan","建立生產計畫")}</button></div>`;
  return `<p class="lead">${L(`계획이 섰습니다. ${esc(b.student_name)} 학생의 책이 어디에 놓였는지 보세요.`, `The plan is ready. See where ${esc(b.student_name)}'s book landed.`, `計畫完成。來看看 ${esc(b.student_name)} 的書被排在哪裡。`)}</p>
  <div class="chain"><div><small>🖨️ ${L("인쇄 배치","Print batch","印刷批次")}</small><span class="mono">${b.batch_code}</span><small>${L(`${b.seq_in_batch}번째로 인쇄`, `Printed #${b.seq_in_batch}`, `第 ${b.seq_in_batch} 本印刷`)}</small></div><i>→</i><div><small>🧺 ${L("교사 묶음","Teacher bundle","老師套組")}</small>${esc(b.teacher_name)}<small>${L(`${b.pack_seq} / ${b.pack_expected}번째`, `${b.pack_seq} of ${b.pack_expected}`, `第 ${b.pack_seq} / ${b.pack_expected} 本`)} · <span class="mono">${b.pack_code}</span></small></div><i>→</i><div><small>📦 ${L("지점 박스","Branch box","分處箱")}</small>${esc(b.branch_name)}<small class="mono">${b.box_code}</small></div><i>→</i><div><small>🚚 ${L("배송 권역","Route","配送路線")}</small>${esc(b.route)}</div></div>
  <h3>${L("제본기에서 나오는 순서 그대로 (색 = 교사)","In the order books leave the binder (color = teacher)","依裝訂機出書的順序（顏色 = 老師）")}</h3>
  <div class="tiles">${(() => { const tint = {}; let last = null, html = "";
    for(const n of b.neighbors){ tint[n.teacher_name] ??= TEACHER_TINTS[Object.keys(tint).length % TEACHER_TINTS.length];
      if(last !== null && last !== n.teacher_name) html += `<div class="tile slip"><b>📄</b>${L("묶음표<br>(교사 바뀜)","Bundle slip<br>(new teacher)","套組單<br>（換老師）")}</div>`;
      last = n.teacher_name;
      html += `<div class="tile ${n.id===b.id?"me":""}" style="background:${tint[n.teacher_name]};color:#1d1f24"><b>${n.id===b.id?"⭐":"📘"}</b>${esc(n.student_name)}<br>${L(`${dayOf(n.visit_dow)}요일 · ${n.seq_in_batch}번`, `${dayOf(n.visit_dow)} · #${n.seq_in_batch}`, `${dayOf(n.visit_dow)} · 第 ${n.seq_in_batch} 本`)}</div>`; }
    return html; })()}</div>
  <p class="mute">${L("⭐ 이 우리 학생입니다. 같은 색(같은 교사)끼리 이미 붙어서 나오므로, 색이 바뀌는 자리에서 끊어 담기만 하면 됩니다.","⭐ is our student. Books of the same color (same teacher) already come out together, so just cut where the color changes.","⭐ 是我們的學生。同顏色（同一位老師）的書已經連在一起出來，只要在顏色改變的地方分開裝即可。")}</p>
  <h3>${L("인쇄 순서에서 앞뒤에 놓인 책","Books just before and after in the print order","印刷順序中前後的書")}</h3><div class="scroll"><table><tr><th>${L("인쇄 순번","Print #","印刷序號")}</th><th>${L("지점","Branch","分處")}</th><th>${L("교사","Teacher","老師")}</th><th>${L("방문","Visit","到府")}</th><th>${L("학생","Student","學生")}</th><th>${L("묶음 안 순번","# in bundle","套組內序號")}</th></tr>${b.neighbors.filter(n => Math.abs(n.seq_in_batch - b.seq_in_batch) <= 3).map(n=>`<tr class="${n.id===b.id?"me":""}"><td>${n.seq_in_batch}</td><td>${esc(n.branch_name)}</td><td>${esc(n.teacher_name)}</td><td>${dayOf(n.visit_dow)}</td><td>${esc(n.student_name)}</td><td>${n.pack_seq}</td></tr>`).join("")}</table></div>
  <p class="mute">${L("같은 교사의 학생이 방문 요일 순으로 나란히 있습니다. 교사가 바뀌는 자리에는 묶음표(간지)가 한 장 들어갑니다.","One teacher's students sit side by side in visit-day order. A bundle slip (separator sheet) goes in wherever the teacher changes.","同一位老師的學生依到府星期排在一起。換老師的地方會插入一張套組單（隔頁紙）。")}</p>`; },
  acts:{ async plan(){ const r = await api(`/api/cycles/${ctx.c1}/plan`, {}); ctx.done[5] = true; msg = ["ok", L(`인쇄 배치 ${r.batches}개 · 교사 묶음 ${r.packs}개 · 지점 박스 ${r.boxes}개 · 권역 ${r.routes}개로 편성했습니다.`, `Planned ${r.batches} print batches · ${r.packs} teacher bundles · ${r.boxes} branch boxes · ${r.routes} routes.`, `已編成 ${r.batches} 個印刷批次 · ${r.packs} 個老師套組 · ${r.boxes} 個分處箱 · ${r.routes} 條路線。`)]; } } },

{ch:"주문에서 인쇄까지", title:"인쇄 데이터", async view(){

    "Now a PDF is made just for this student. The cover carries the name, this week's contents, sorting information and a QR code; the body places the content pages as they are.",
    "現在為這位學生製作專屬 PDF。封面有姓名、本週內容、配送分揀資訊與 QR 碼，內頁則直接置入原稿。")}</p>
  <div class="row"><button class="b p" data-pdf="book" data-id="${b.id}">${L("책 PDF 보기","View book PDF","查看書的 PDF")}</button><button class="b" data-pdf="imposed" data-id="${b.id}">${L("인쇄용 터잡기 PDF 보기","View imposed print PDF","查看印刷用拼版 PDF")}</button><button class="b" data-pdf="pack" data-id="${b.pack_id}">${L("교사 묶음표 보기","View teacher bundle slip","查看老師套組單")}</button></div>
  <div class="why">${L(`롤 용지(폭 ${w.web_mm}mm, 인쇄 가능 ${w.printable_mm}mm)에 펼친 면을 ${w.rotated?"돌려서 ":""}${w.lanes}줄로 앉히고, 재단용 여백을 사방 ${w.bleed_mm}mm 둡니다. 본문 쪽마다 아래에 책 코드와 쪽 번호가 작게 찍혀 낱장이 빠지거나 섞이면 알 수 있습니다.`,
    `Spreads are placed ${w.rotated?"rotated, ":""}in ${w.lanes} lane(s) on the paper roll (${w.web_mm} mm wide, ${w.printable_mm} mm printable), with ${w.bleed_mm} mm bleed on every side. Each body page carries the book code and page number in small print at the bottom, so a missing or mixed-up sheet is noticed.`,
    `在捲筒紙（寬 ${w.web_mm}mm，可印 ${w.printable_mm}mm）上${w.rotated?"旋轉後":""}以 ${w.lanes} 列排放跨頁，四邊各留 ${w.bleed_mm}mm 出血。每一頁內頁下方都印有小小的書代碼與頁碼，缺頁或混頁時就能察覺。`)}</div>
  <p class="mute">${L("뒤표지에는 권역·지점·교사·방문일·묶음 순번이 크게 찍혀, 스캐너가 없어도 손으로 나눌 수 있습니다.","The back cover shows the route, branch, teacher, visit day and bundle position in large type, so books can be sorted by hand even without a scanner.","封底以大字印出路線、分處、老師、到府日與套組序號，即使沒有掃描器也能用手分揀。")}</p>`; },
  acts:{} },

{ch:"주문에서 인쇄까지", title:"인쇄와 제본 검수", async view(){
  const b = await bookOf(ctx.c1); if(!b || !b.batch_id) return needPlan();
  return `<p class="lead">${L(`인쇄하고 중철로 묶은 뒤, 책마다 QR 코드를 한 번 읽습니다. 이것이 <b>제본 검수</b>입니다.`, `After printing and saddle stitching, each book's QR code is read once. This is the <b>binding check</b>.`, `印刷並以騎馬釘裝訂後，每本書讀取一次 QR 碼。這就是<b>裝訂檢驗</b>。`)}</p>
  <p>${L(`${esc(b.student_name)} 학생의 책:`, `${esc(b.student_name)}'s book:`, `${esc(b.student_name)} 的書：`)} ${stat(b.status)}</p>
  <div class="why">${L(`인쇄 순서대로 나와야 하므로, <b>건너뛴 책이 있으면 그 자리에서 경고</b>합니다. 빠진 책을 출고 직전이 아니라 제본기 앞에서 알게 됩니다. 불량이면 "불량 등록"을 하고, 재인쇄본이 급행으로 다시 찍혀 같은 묶음 자리로 돌아옵니다.`,
    `Books must come out in print order, so <b>a skipped book triggers a warning on the spot</b>. A missing book is caught at the binder, not just before shipping. A defective book is logged, and an express reprint returns to the same place in its bundle.`,
    `書必須依印刷順序出來，所以<b>只要漏了一本，當場就會警告</b>。缺書在裝訂機前就會發現，而不是出貨前。不良品登記後會以急件重印，送回同一個套組位置。`)}</div>
  <div class="row"><button class="b p" data-act="bind" ${["planned","printed"].includes(b.status)?"":"disabled"}>${L("인쇄하고 제본 검수까지 진행","Print and run the binding check","進行印刷與裝訂檢驗")}</button><span class="mute">${L("이번 주 책 전체를 실제 스캔 규칙으로 처리합니다(몇 초 걸립니다).","Processes all of this week's books with the real scan rules (takes a few seconds).","以實際掃描規則處理本週所有的書（需要幾秒鐘）。")}</span></div>`; },
  acts:{ async bind(){ const r = await sim("bind"); ctx.done[7] = true; msg = ["ok", L(`${num(r.print)}권 인쇄, ${num(r.bind)}권 검수 완료.`, `${num(r.print)} books printed, ${num(r.bind)} checked.`, `已印刷 ${num(r.print)} 本，檢驗完成 ${num(r.bind)} 本。`)]; } } },

{ch:"아래로 내려보내기", title:"교사 묶음 · 지점 박스 · 권역 상차", async view(){
  const b = await bookOf(ctx.c1); if(!b || !b.batch_id) return needPlan();
  const look = b.box_code ? await api(`/api/lookup?code=${b.box_code}`).catch(()=>null) : null;
  return `<p class="lead">${L(`이제 위에서 정한 줄을 거꾸로 타고 내려갑니다: 책을 <b>교사 묶음</b>에, 묶음을 <b>지점 박스</b>에, 박스를 <b>권역 차량</b>에 싣습니다. 단계마다 QR 코드를 읽습니다.`,
    `Now we follow the chain back down: books into <b>teacher bundles</b>, bundles into <b>branch boxes</b>, boxes onto <b>route trucks</b>. A QR code is read at every step.`,
    `現在沿著前面那條線往下走：書裝進<b>老師套組</b>，套組裝進<b>分處箱</b>，箱子裝上<b>路線貨車</b>。每一步都讀取 QR 碼。`)}</p>
  <div class="chain"><div><small>📘 ${L("책","Book","書")}</small>${stat(b.status)}<small class="mono">${b.code}</small></div><i>→</i><div><small>🧺 ${L("교사 묶음","Teacher bundle","老師套組")}</small>${esc(b.teacher_name)}<small class="mono">${b.pack_code}</small></div><i>→</i><div><small>📦 ${L("지점 박스","Branch box","分處箱")}</small>${esc(b.branch_name)} ${look?chip(META.status[look.status]||look.status, look.status==="open"?"warn":"ok"):""}<small class="mono">${b.box_code}</small></div><i>→</i><div><small>🚚 ${L("배송 권역","Route","配送路線")}</small>${esc(b.route)}<small>${look&&look.waybill?L(`운송장 ${esc(look.waybill)}`, `Waybill ${esc(look.waybill)}`, `運單 ${esc(look.waybill)}`):L("아직 상차 전","Not loaded yet","尚未裝車")}</small></div></div>
  <div class="why">${L(`<b>틀리면 그 자리에서 막습니다.</b> 다른 교사의 책을 묶음에 넣으면 스캔이 거부되고 어디로 보내야 하는지 알려 줍니다. 덜 찬 묶음은 박스에 못 넣고, 덜 찬 박스는 차에 못 싣습니다.`,
    `<b>Mistakes are blocked on the spot.</b> Putting another teacher's book in a bundle is rejected at scan, with a note on where it belongs. An incomplete bundle can't go in a box, and an incomplete box can't go on the truck.`,
    `<b>出錯當場就擋下。</b>把別位老師的書放進套組，掃描會被拒絕，並告訴你該送到哪裡。沒裝滿的套組不能放進箱子，沒裝滿的箱子不能上車。`)}</div>
  ${ctx.wrong?`<div class="note bad">${L("거부됨","Rejected","已拒絕")} — ${esc(trStr(ctx.wrong))}</div>`:""}
  <div class="row"><button class="b" data-act="wrong" ${b.status==="bound"?"":"disabled"}>${L("일부러 다른 교사 묶음에 넣어 보기","Try putting it in another teacher's bundle","故意放進別位老師的套組")}</button><button class="b p" data-act="load" ${["bound","packed"].includes(b.status)?"":"disabled"}>${L("묶음 포장 → 박스 → 상차까지 진행","Bundle → box → load the truck","套組包裝 → 裝箱 → 裝車")}</button></div>
  ${b.status==="printed"||b.status==="planned"?need(false,L("먼저 8단계에서 제본 검수까지 진행해 주세요.","First run the binding check in step 8.","請先在第 8 步進行到裝訂檢驗。")):""}`; },
  acts:{ async wrong(){ const b = await bookOf(ctx.c1); const tree = await api(`/api/cycles/${ctx.c1}/tree`);
      const other = tree.flatMap(r => r.boxes).flatMap(x => x.packs).find(p => p.code !== b.pack_code && p.status === "open");
      const r = await apiRaw("/api/scan", {station:"pack", code:b.code, context:other.code, operator:"시연"}); ctx.wrong = r.message;   // 원문으로 둔다(언어를 바꿔도 다시 번역)
      msg = [r.ok?"ok":"bad", r.ok?L("들어가 버렸습니다(예상 밖).","It went in (unexpected).","竟然放進去了（意料之外）。"):`${L("스캔 거부","Scan rejected","掃描被拒絕")}: ${trStr(r.message)}`]; },
    async load(){ const r = await sim("load"); ctx.done[8] = true; msg = ["ok", L(`책 ${num(r.pack)}권을 묶음 ${num(r.box)}개에 담고, 박스 ${num(r.load)}개를 실었습니다.`, `Packed ${num(r.pack)} books into ${num(r.box)} bundles and loaded ${num(r.load)} boxes.`, `已把 ${num(r.pack)} 本書裝進 ${num(r.box)} 個套組，並裝載 ${num(r.load)} 個箱子。`)]; } } },

{ch:"아래로 내려보내기", title:"지점 입고 · 교사 수령 · 학생 전달", async view(){
  const b = await bookOf(ctx.c1); if(!b || !b.batch_id) return needPlan();
  const flow = ["planned","printed","bound","packed","shipped","received","handed","delivered"], at = flow.indexOf(b.status);
  return `<p class="lead">${L("차가 지점에 도착하면 박스를 읽고(입고), 교사가 자기 묶음을 읽고 가져가고(수령), 방문 수업에서 학생에게 주며 책을 읽습니다(전달).",
    "When the truck reaches the branch, the box is scanned (receipt); the teacher scans and takes their bundle (pickup); and the book is scanned as it's handed to the student at the home visit (delivery).",
    "貨車抵達分處時掃描箱子（入庫），老師掃描並領走自己的套組（領取），到府上課交給學生時再掃描書（交付）。")}</p>
  <div class="row">${flow.map((s,i)=>chip(`${["📋","🖨️","📎","🧺","🚚","🏢","👩‍🏫","🧒"][i]} ${META.status[s]}`, i<=at?"ok":"")).join(" → ")}</div>
  <h3>${L("이 책이 지나온 길(스캔 기록)","Where this book has been (scan history)","這本書走過的路（掃描紀錄）")}</h3><div class="scroll"><table><tr><th>${L("시각","Time","時間")}</th><th>${L("어디서","Where","地點")}</th><th>${L("결과","Result","結果")}</th><th>${L("내용","Details","內容")}</th></tr>${b.history.map(h=>`<tr><td>${esc(h.ts.replace("T"," "))}</td><td>${esc(META.stations[h.station]||h.station)}</td><td>${h.ok?chip(L("확인","OK","確認"),"ok"):chip(L("거부","Rejected","拒絕"),"bad")}</td><td>${esc(h.message||"")}</td></tr>`).join("")||`<tr><td class="mute">${L("아직 기록이 없습니다.","No records yet.","尚無紀錄。")}</td></tr>`}</table></div>
  <div class="why">${L(`박스가 움직이면 안에 든 묶음과 책의 상태가 함께 바뀝니다. 본사·지점·교사 누구나 <b>책 코드 하나로 지금 어디 있는지</b> 조회할 수 있습니다. 거부된 스캔까지 모두 기록에 남습니다.`,
    `When a box moves, the bundles and books inside update with it. Head office, branches and teachers can all <b>look up where a book is with just its code</b>. Even rejected scans are recorded.`,
    `箱子一移動，裡面的套組與書的狀態也一起更新。總部、分處、老師都能<b>只用書的代碼查到它現在在哪裡</b>。連被拒絕的掃描也會留下紀錄。`)}</div>
  <div class="row"><button class="b p" data-act="deliver" ${b.status==="shipped"?"":"disabled"}>${L("지점 입고 → 교사 수령 → 학생 전달까지 진행","Branch receipt → teacher pickup → delivery to student","分處入庫 → 老師領取 → 交給學生")}</button></div>
  ${at<4?need(false,L("먼저 9단계에서 상차까지 진행해 주세요.","First go as far as truck loading in step 9.","請先在第 9 步進行到裝車。")):""}`; },
  acts:{ async deliver(){ const r = await sim("deliver"); ctx.done[9] = true; msg = ["ok", L(`박스 ${num(r.recv)}개 입고, 묶음 ${num(r.hand)}개 수령, 책 ${num(r.deliver)}권 전달.`, `${num(r.recv)} boxes received, ${num(r.hand)} bundles picked up, ${num(r.deliver)} books delivered.`, `入庫 ${num(r.recv)} 箱、領取 ${num(r.hand)} 個套組、交付 ${num(r.deliver)} 本書。`)]; } } },

{ch:"수업과 다음 주", title:"수업 확인 — 다 했는가", async view(){
  const b = await bookOf(ctx.c1); if(!b || b.status !== "delivered") return needDelivered();
  const s = await student(), math = b.items.find(i => i.kind==="unit" && MATH.includes(i.subject_name)) || b.items.find(i => i.kind==="unit");
  return `<p class="lead">${L(`교사는 다음 방문 때 <b>지난 책을 다 했는지</b> 확인합니다. 이 한 번의 확인이 다음 교재를 만들지 말지를 정합니다.`, `At the next visit, the teacher checks <b>whether last week's book was finished</b>. That one check decides whether the next workbook is made.`, `下次到府時，老師確認<b>上一本書是否做完</b>。這一次確認決定是否製作下一本講義。`)}</p>
  <p>${L("지금 기록:","Current record:","目前紀錄：")} ${b.lesson?chip(META.lesson[b.lesson.result], b.lesson.result==="done"?"ok":"warn")+(b.lesson.note?` <span class="mute">${esc(b.lesson.note)}</span>`:""):chip(L("아직 확인 안 함","Not checked yet","尚未確認"))}</p>
  <div class="scroll"><table><tr><th>${L("과목","Subject","科目")}</th><th>${L("다음에 나갈 호","Next issue","下一期")}</th><th>${L("다음 컷오프","Next cutoff","下次截單")}</th></tr>${s.plan.map(e=>`<tr><td>${esc(e.subject_name)}</td><td>${L(`${e.next_seq}호`, `No. ${e.next_seq}`, `第 ${e.next_seq} 期`)}</td><td>${e.hold_next?chip(`${L("생산 보류","Production on hold","暫停生產")} — ${e.hold_reason||L("학습 지연","learning delay","學習延遲")}`,"warn"):chip(L("정상 생산","Normal production","正常生產"),"ok")}</td></tr>`).join("")}</table></div>
  <div class="why">${L(`<b>교재는 진도표대로 무조건 나가지 않습니다.</b> "일부만 했다"나 "결석"으로 기록하면 그 과목은 다음 컷오프 한 번을 쉽니다. 못 한 교재 위에 새 교재가 쌓이지 않습니다.`,
    `<b>Workbooks don't go out blindly by the schedule.</b> Recording "partly done" or "absent" makes that subject skip the next cutoff once. New workbooks don't pile up on unfinished ones.`,
    `<b>講義不會照進度表硬是出貨。</b>記錄為「只做一部分」或「缺席」時，該科目會休息一次截單。不會在沒寫完的講義上再疊新講義。`)}</div>
  <div class="row"><button class="b p" data-act="late" data-subject="${math.subject_id}">${L(`${esc(math.subject_name)}을(를) 다 못 했다고 기록(지연)`, `Record ${esc(math.subject_name)} as not finished (delayed)`, `記錄${esc(math.subject_name)}沒做完（延遲）`)}</button><button class="b" data-act="alldone">${L("모두 완료로 기록","Record all as done","全部記錄為完成")}</button></div>`; },
  acts:{ async late(el){ const b = await bookOf(ctx.c1); const r = await api(`/api/books/${b.id}/lesson`, {result:"partial", note:"절반만 풀었음", subject_ids:[Number(el.dataset.subject)], actor:"시연 교사"}); ctx.done[10] = true; msg = ["warn", L(`지연으로 기록했습니다. ${r.held_subjects.join(", ")} 과목은 다음 컷오프에서 생산하지 않습니다.`, `Recorded as delayed. ${r.held_subjects.join(", ")} won't be produced at the next cutoff.`, `已記錄為延遲。${r.held_subjects.join("、")}在下次截單不會生產。`)]; },
    async alldone(){ const b = await bookOf(ctx.c1); await api(`/api/books/${b.id}/lesson`, {result:"done", actor:"시연 교사"}); ctx.done[10] = true; msg = ["ok", L("완료로 기록했습니다. 다음 컷오프에서 모든 과목이 정상 생산됩니다.","Recorded as done. Every subject is produced normally at the next cutoff.","已記錄為完成。下次截單所有科目都會正常生產。")]; } } },

{ch:"수업과 다음 주", title:"다음 주 컷오프 — 지연된 과목은 나가지 않는다", async view(){
  if(!ctx.done[10]) return need(false, L("먼저 11단계에서 수업 확인을 기록해 주세요.","First record the lesson check in step 11.","請先在第 11 步記錄上課確認。"));
  if(!ctx.c2) return `<p class="lead">${L("한 주가 지나 다음 컷오프입니다. 지연으로 기록된 과목이 정말 빠지는지 확인합니다.","A week has passed and it's the next cutoff. Let's check that the delayed subject really drops out.","過了一週，又到下次截單。來確認被記錄為延遲的科目是否真的被排除。")}</p><div class="row"><button class="b p" data-act="next">${L("다음 주 사이클을 열고 주문 확정","Open next week's cycle and fix orders","開啟下週週期並確定訂單")}</button></div>`;
  const [b1, b2, held, s] = await Promise.all([bookOf(ctx.c1), bookOf(ctx.c2), api(`/api/cycles/${ctx.c2}/held`), student()]);
  const mine = held.filter(h => h.ref_code === s.code);
  const units = b => b.items.filter(i=>i.kind==="unit").map(i=>esc(i.title)).join(", ");
  return `<p class="lead">${L(`<b>${ctx.c2code}</b> 주문을 확정했습니다. 이번 주에 <b>${num(ctx.c2stats.held)}건</b>이 학습 지연으로 생산에서 빠졌습니다.`, `Orders for <b>${ctx.c2code}</b> are fixed. This week <b>${num(ctx.c2stats.held)}</b> item(s) were left out of production because of learning delays.`, `<b>${ctx.c2code}</b> 的訂單已確定。本週有 <b>${num(ctx.c2stats.held)} 筆</b>因學習延遲而未生產。`)}</p>
  ${mine.map(h=>`<div class="note warn">${esc(h.detail)}</div>`).join("")||`<div class="note ok">${L(`${esc(s.name)} 학생은 지연 기록이 없어 모든 과목이 정상 생산됐습니다.`, `${esc(s.name)} has no delay records, so every subject was produced.`, `${esc(s.name)} 沒有延遲紀錄，所有科目都正常生產。`)}</div>`}
  <h3>${L(`${esc(s.name)} 학생 — 지난주 책과 이번 주 책`, `${esc(s.name)}: last week's and this week's book`, `${esc(s.name)}：上週與本週的書`)}</h3>
  <div class="scroll"><table><tr><th>${L("주","Week","週")}</th><th>${L("들어간 호","Issues included","包含的期數")}</th><th>${L("쪽","Pages","頁數")}</th></tr>
    <tr><td>${ctx.c1code}</td><td>${b1?units(b1):""}</td><td>${b1?b1.pages:""}</td></tr>
    <tr class="me"><td>${ctx.c2code}</td><td>${b2?units(b2):L("책 없음(모든 과목 보류)","No book (every subject on hold)","沒有書（所有科目暫停）")}</td><td>${b2?b2.pages:"-"}</td></tr></table></div>
  <div class="why">${L(`빠진 과목의 "다음에 나갈 호"는 <b>그대로 남아 있습니다</b>. 건너뛰는 것이 아니라 한 주 쉬는 것입니다. 종이도, 인쇄도, 배송도 그만큼 줄어듭니다.`, `The left-out subject's "next issue" <b>stays where it was</b>. It isn't skipped; it rests for a week. Paper, printing and delivery shrink accordingly.`, `被排除科目的「下一期」<b>維持不變</b>。不是跳過，而是休息一週。紙張、印刷與配送也跟著減少。`)}</div>`; },
  acts:{ async next(){ const st = await openAndFreeze("c2"); ctx.done[11] = true; msg = ["ok", L(`책 ${num(st.books)}권 확정, 학습 지연 보류 ${num(st.held)}건.`, `${num(st.books)} books fixed, ${num(st.held)} held for learning delay.`, `已確定 ${num(st.books)} 本書，因學習延遲暫停 ${num(st.held)} 筆。`)]; } } },

{ch:"수업과 다음 주", title:"다시 이어 가기", async view(){
  if(!ctx.c2) return need(false, L("먼저 12단계에서 다음 주 주문을 확정해 주세요.","First fix next week's orders in step 12.","請先在第 12 步確定下週訂單。"));
  if(!ctx.c3) return `<p class="lead">${L(`보류는 <b>한 번</b>입니다. 그다음 주에는 멈춘 자리에서 다시 이어 갑니다. 여전히 못 했다면 교사가 다시 지연으로 기록하면 됩니다.`, `A hold lasts <b>once</b>. The week after, the subject continues from where it stopped. If it's still not done, the teacher records a delay again.`, `暫停只有<b>一次</b>。再下一週會從停下的地方繼續。如果仍然沒做完，老師再記錄一次延遲即可。`)}</p><div class="row"><button class="b p" data-act="third">${L("그다음 주 사이클을 열고 주문 확정","Open the following week's cycle and fix orders","開啟再下一週的週期並確定訂單")}</button></div>`;
  const [b2, b3, s] = await Promise.all([bookOf(ctx.c2), bookOf(ctx.c3), student()]);
  const list = b => b ? b.items.filter(i=>i.kind==="unit").map(i=>esc(i.title)).join(", ") : L("책 없음","No book","沒有書");
  return `<p class="lead">${L(`<b>${ctx.c3code}</b> 주문을 확정했습니다. 쉬었던 과목이 멈춘 호에서 다시 나갑니다.`, `Orders for <b>${ctx.c3code}</b> are fixed. The subject that rested goes out again from the issue where it stopped.`, `<b>${ctx.c3code}</b> 的訂單已確定。休息過的科目從停下的那一期重新出貨。`)}</p>
  <div class="scroll"><table><tr><th>${L("주","Week","週")}</th><th>${L(`${esc(s.name)} 학생의 책에 들어간 호`, `Issues in ${esc(s.name)}'s book`, `${esc(s.name)} 的書包含的期數`)}</th></tr><tr><td>${ctx.c2code}</td><td>${list(b2)}</td></tr><tr class="me"><td>${ctx.c3code}</td><td>${list(b3)}</td></tr></table></div>
  <div class="why">${L(`<b>자동 보류도 있습니다.</b> 교사가 아무 기록도 하지 않은 채 수업 확인이 안 된 교재가 ${META.hold.max_unchecked_weeks}주치 쌓이면, 그 학생의 새 교재는 만들지 않습니다. 기록이 없어도 교재가 끝없이 쌓이지 않습니다.`,
    `<b>There is also an automatic hold.</b> If ${META.hold.max_unchecked_weeks} weeks of workbooks pile up with no lesson check from the teacher, no new workbook is made for that student. Workbooks can't pile up forever even without records.`,
    `<b>也有自動暫停。</b>如果老師完全沒有記錄、未確認的講義累積了 ${META.hold.max_unchecked_weeks} 週，就不再為該學生製作新講義。即使沒有紀錄，講義也不會無限堆積。`)}</div>`; },
  acts:{ async third(){ const st = await openAndFreeze("c3"); ctx.done[12] = true; msg = ["ok", L(`책 ${num(st.books)}권 확정, 보류 ${num(st.held)}건.`, `${num(st.books)} books fixed, ${num(st.held)} on hold.`, `已確定 ${num(st.books)} 本書，暫停 ${num(st.held)} 筆。`)]; } } },

{ch:"수업과 다음 주", title:"채점 사진 — 누구 것인지 고르지 않는다", async view(){
  const b = await bookOf(ctx.c1); if(!b || b.status !== "delivered") return needDelivered();
  const s = await student(), g = s.gradings, last = ctx.grade ? trData(ctx.grade) : null;
  return `<p class="lead">${L(`교사가 채점한 쪽을 <b>사진으로 찍어 올리기만</b> 하면, 그 쪽에 찍힌 고유 QR 코드로 누구의 어느 책, 어느 과목 몇 호 몇 쪽인지 시스템이 알아서 정리합니다.`, `The teacher <b>just takes a photo of a graded page and uploads it</b>. From the page's own QR code, the system works out whose book, which subject, issue and page it is.`, `老師只要<b>把批改好的那一頁拍照上傳</b>，系統就會透過該頁專屬的 QR 碼，自動整理出是誰的哪本書、哪個科目第幾期第幾頁。`)}</p>
  <div class="why">${L(`본문 쪽마다 아래 가운데에 <b>쪽 고유 QR 코드</b>가 있습니다(책 코드 + 쪽 번호). 학생이 수십 명이어도 교사는 학생을 고르거나 쪽을 적을 필요가 없습니다. 틀린 문항을 함께 표시하면 그 학생의 <b>약한 문항</b>으로 쌓여 나중에 오답 노트로 모아 찍힙니다.`,
    `Every body page has a <b>unique page QR code</b> at the bottom center (book code + page number). Even with dozens of students, the teacher never picks a student or writes a page number. Marked wrong answers build up as that student's <b>weak items</b> and are later printed together as review notes.`,
    `每一頁內頁下方正中央都有<b>頁面專屬 QR 碼</b>（書代碼 + 頁碼）。即使有幾十位學生，老師也不必挑選學生或填寫頁碼。一起標示答錯的題目，就會累積為該學生的<b>弱點題目</b>，之後集中印成錯題本。`)}</div>
  ${last?`<div class="chain"><div><small>${L("사진 한 장","One photo","一張照片")}</small>${esc(last.read_by)}</div><i>→</i><div><small>${L("학생","Student","學生")}</small>${esc(last.book.student_name)}<small>${esc(last.book.cycle_code)}</small></div><i>→</i><div><small>${L("과목·호","Subject & issue","科目・期數")}</small>${esc(last.unit_title||last.part)}</div><i>→</i><div><small>${L("쪽","Page","頁")}</small>${L(`${last.unit_page||"-"}쪽`, `p. ${last.unit_page||"-"}`, `第 ${last.unit_page||"-"} 頁`)}<small>${L(`책 전체에서는 ${last.page}쪽`, `p. ${last.page} of the whole book`, `全書第 ${last.page} 頁`)}</small></div><i>→</i><div><small>${L("틀린 문항","Wrong answers","答錯的題目")}</small>${L(`${last.wrong_items.join(", ")||"없음"}번`, `No. ${last.wrong_items.join(", ")||"none"}`, `第 ${last.wrong_items.join("、")||"無"} 題`)}<small>${L("약한 문항에 추가됨","Added to weak items","已加入弱點題目")}</small></div></div>
    ${last.image_file?`<p><a href="uploads/${esc(last.image_file)}" target="_blank">${L("올라간 사진 보기","View the uploaded photo","查看上傳的照片")}</a></p>`:""}`:""}
  <h3>${L(`${esc(s.name)} 학생에게 정리된 채점 사진`, `Graded photos filed for ${esc(s.name)}`, `已歸檔到 ${esc(s.name)} 的批改照片`)}</h3><div class="scroll"><table><tr><th>${L("올린 때","Uploaded","上傳時間")}</th><th>${L("호","Issue","期數")}</th><th>${L("쪽","Page","頁")}</th><th>${L("틀린 문항","Wrong answers","答錯的題目")}</th></tr>${g.map(x=>`<tr><td>${esc(x.created_at.replace("T"," "))}</td><td>${esc(x.unit_title||"")}</td><td>${x.unit_page||""}</td><td>${esc(x.wrong_items||"")}</td></tr>`).join("")||`<tr><td class="mute">${L("아직 없습니다.","None yet.","尚無。")}</td></tr>`}</table></div>
  <h3>${L("약한 문항(오답 노트 재료)","Weak items (review-note material)","弱點題目（錯題本素材）")}</h3><div class="row">${s.weak.map(w=>chip(L(`${w.title} ${w.item_no}번`, `${w.title} · Q${w.item_no}`, `${w.title} 第 ${w.item_no} 題`), w.status==="printed"?"ok":"warn")).join(" ")||`<span class="mute">${L("아직 없습니다.","None yet.","尚無。")}</span>`}</div>
  <div class="row" style="margin-top:12px"><button class="b p" data-act="photo">${L("이 학생 책의 한 쪽을 찍어 올려 보기","Photograph and upload a page from this student's book","拍下這位學生書中的一頁並上傳")}</button><span class="mute">${L("책의 실제 쪽을 그림으로 만들어 사진처럼 올립니다. 틀린 문항 두 개를 함께 표시합니다.","Renders a real page of the book as an image and uploads it like a photo, with two wrong answers marked.","把書的實際頁面做成圖片，像照片一樣上傳，並標示兩題答錯。")}</span></div>
  <p class="mute">${L(`진짜 사진으로 해 보려면 책 PDF를 인쇄해 채점한 뒤, 운영 화면의 "교사 화면 → 채점 사진 올리기"에서 올리세요.`, `To try with a real photo, print the book PDF, grade it, and upload it in the operations screen under "Teacher → Upload graded photo".`, `若要用真的照片試試，請印出書的 PDF 批改後，在營運畫面的「老師畫面 → 上傳批改照片」上傳。`)}</p>`; },
  acts:{ async photo(){ const b = await bookOf(ctx.c1); const n = (ctx.gradeN || 0); const page = 3 + n; const per = META.book.items_per_page;
      const where = await api(`/api/grading/locate?code=${b.code}&page=${page}`);
      const raw = await apiRaw(`/api/books/${b.id}/grading-sample`, {page, wrong_items: where.items.length ? [where.items[1], where.items[per-1]] : []});
      ctx.grade = raw; ctx.gradeN = n + 1; ctx.done[13] = true; const r = trData(raw);   // ctx 에는 원문(언어를 바꿔도 다시 번역)
      msg = ["ok", L(`사진 한 장으로 ${r.book.student_name} · ${r.unit_title||r.part} ${r.unit_page||""}쪽에 정리됐습니다 (${r.read_by}).`, `One photo was filed to ${r.book.student_name} · ${r.unit_title||r.part} p. ${r.unit_page||""} (${r.read_by}).`, `一張照片已歸檔到 ${r.book.student_name} · ${r.unit_title||r.part} 第 ${r.unit_page||""} 頁（${r.read_by}）。`)]; } } },

  <p>${L(`약한 문항을 체크해 두었다가 모아 찍는 <b>오답 노트</b>, 불량 <b>재인쇄</b>와 묶음 누락 처리, 고객사 시스템과 주고받는 <b>연동 파일</b>, 회원 수를 넣어 보는 <b>물량·설비 환산</b>.`,
    `<b>Review notes</b> that collect and print checked weak items, defect <b>reprints</b> and missing-bundle handling, <b>interchange files</b> with the client's systems, and a <b>volume and equipment calculator</b> that takes member counts.`,
    `把勾選的弱點題目集中印出的<b>錯題本</b>、不良品<b>重印</b>與套組缺件處理、與客戶系統往來的<b>介接檔案</b>，以及輸入會員數即可估算的<b>產量・設備換算</b>。`)} <a class="live" href="/">${L("운영 화면 열기","Open the operations screen","開啟營運畫面")}</a></p>`; },
  acts:{} },
];

function rail(){ let last = "", html = "";
  STEPS.forEach((s, i) => { if(chOf(i) !== last){ html += `<h3>${esc(chOf(i))}</h3>`; last = chOf(i); }
    html += `<button data-go="${i}" class="${i===ctx.step?"on":""} ${ctx.done[i]?"done":""}"><span class="n">${ctx.done[i]?"✓":i+1}</span>${esc(titleOf(i))}</button>`; });
  $("#rail").innerHTML = html; }
// 발표 모드에서 → 를 누르면 먼저 실행하는 그 단계의 일(데이터를 지우는 초기화는 넣지 않는다)
const AUTO = {1:["join","가입 처리","Sign up","辦理入會"], 3:["assets","견본 원고 붙이기","Attach sample content","附上範例原稿"], 4:["freeze","주문 확정","Fix orders","確定訂單"], 5:["plan","생산 계획 세우기","Make the production plan","建立生產計畫"],
  7:["bind","인쇄하고 제본 검수","Print and binding check","印刷與裝訂檢驗"], 8:["load","묶음 포장 → 박스 → 상차","Bundle → box → truck","套組 → 裝箱 → 裝車"], 9:["deliver","입고 → 교사 수령 → 학생 전달","Receipt → pickup → delivery","入庫 → 領取 → 交付"],
  10:["late","수업 확인(수학 지연) 기록","Record lesson check (math delayed)","記錄上課確認（數學延遲）"], 11:["next","다음 주 주문 확정","Fix next week's orders","確定下週訂單"], 12:["third","그다음 주 주문 확정","Fix the following week's orders","確定再下一週訂單"], 13:["photo","채점 사진 올리기","Upload a graded photo","上傳批改照片"]};
const pending = () => { const a = AUTO[ctx.step]; if(!a || ctx.done[ctx.step]) return null;
  const btn = document.querySelector(`#main [data-act="${a[0]}"]`); return btn && !btn.disabled ? [btn, L(a[1], a[2], a[3])] : null; };
function bar(){ $("#bar-count").textContent = `${ctx.step+1} / ${STEPS.length}`;
  $("#bar-prog").style.width = `${(ctx.step+1) / STEPS.length * 100}%`;
  if(P.on) return playUi(); const p = pending(), last = ctx.step >= STEPS.length - 1;
  $("#bar-hint").innerHTML = p ? `${ui("press")} <b>${esc(p[1])}</b>` : last ? ui("last") : `${ui("next")} <b>${esc(titleOf(ctx.step+1))}</b>`; }
let busy = false;
async function runAct(btn){ const label = btn.textContent; btn.disabled = true; btn.textContent = "진행 중…";
  busy = true; document.body.classList.add("busy");
  try{ await STEPS[ctx.step].acts[btn.dataset.act](btn); }catch(err){ msg = ["bad", err.message]; btn.textContent = label; }
  busy = false; document.body.classList.remove("busy"); await render();
  // 발표 모드: 실행 결과가 사진 아래에 있으므로 결과 쪽으로 내려 보여 준다
  if(document.body.classList.contains("show")) document.querySelector("#main .card .note")?.scrollIntoView({behavior:"smooth", block:"start"}); }
async function go(step){ ctx.step = Math.max(0, Math.min(STEPS.length-1, step)); msg = null; window.scrollTo(0,0); return render(true); }
async function forward(){ if(busy) return; const p = pending(); if(p) return runAct(p[0]); if(ctx.step < STEPS.length-1) return go(ctx.step+1); }
async function render(fresh){ rail(); bar(); const s = STEPS[ctx.step]; let body;
  if(typeof P !== "undefined" && P.on){ pointed = null; hideFinger(); }
  try{ body = await s.view(); }catch(e){ body = `<div class="note bad">불러오지 못했습니다: ${esc(e.message)}</div>`; }
  $("#main").className = fresh ? "fadein" : "";
  $("#main").innerHTML = `${journey()}<div class="card"><div class="mute">${esc(chOf(ctx.step))} · ${ctx.step+1} / ${STEPS.length}</div><h2>${esc(titleOf(ctx.step))}</h2>${photo(ctx.step)}${SCENES[ctx.step] ? SCENES[ctx.step]() : ""}${msg?`<div class="note ${msg[0]}">${esc(msg[1])}</div>`:""}${body}</div>
    <div class="nav"><button class="b" data-go="${ctx.step-1}" ${ctx.step?"":"disabled"}>← ${L("이전","Back","上一步")}</button><button class="b p" data-go="${ctx.step+1}" ${ctx.step<STEPS.length-1?"":"disabled"}>${L("다음","Next","下一步")} →</button></div>`;
  bar(); save(); }
// 발표 모드: 전체 화면 + 키보드(→·Space·PageDown 앞으로, ←·PageUp 뒤로, F 전체 화면, Esc 끝)
function showOn(){ document.body.classList.add("show"); document.documentElement.requestFullscreen?.().catch(() => {}); bar(); }
function showOff(){ document.body.classList.remove("show"); if(document.fullscreenElement) document.exitFullscreen?.(); }
$("#show-on").onclick = showOn; $("#show-off").onclick = () => { if(P.on) stopPlay(); showOff(); };
$("#bar-next").onclick = forward; $("#bar-prev").onclick = () => !busy && go(ctx.step-1);
document.addEventListener("fullscreenchange", () => { if(!document.fullscreenElement){ document.body.classList.remove("show"); if(P.on) stopPlay(); } });
// ── 나레이션 자동 시연 ─────────────────────────────────────────────────
// 대본(narration.json)과 음성(audio/sNN_intro|after.mp3, tools/make_demo_narration.py)으로
// 단계마다: 화면 열기 → 설명(손가락이 가리킴) → 실행 → 결과 설명 → 다음 단계. 스페이스로 멈춤·계속.
// 음성 파일은 시작할 때 한 번에 모두 받아 메모리에 둔다 — 재생 중에는 네트워크를 쓰지 않아 끊기지 않는다.
const CLIPS = {};
async function preloadClips(){
  const names = NARR.flatMap((n, i) => ["intro", "after"].filter(p => n[p]).map(p => `${audioDir()}s${pad(i)}_${p}.mp3`)).filter(k => !(k in CLIPS));
  if(!names.length) return;
  bubble(ui("prep")(names.length), "");
  await Promise.all(names.map(async k => { try{ const r = await fetch(k); CLIPS[k] = r.ok ? URL.createObjectURL(await r.blob()) : null; }catch(e){} })); }
const P = {on:false, paused:false, gen:0, audio:null, skip:null, resume:null, rate:1.15};
const pad = i => String(i).padStart(2, "0");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const waitResume = () => P.paused ? new Promise(r => { P.resume = r; }) : Promise.resolve();
let pointed = null;
// 손가락은 문서 좌표(absolute)에 둔다 — 화면이 스크롤돼도 대상과 함께 움직이므로 따라잡을 필요가 없다.
// 대상이 다시 그려져 사라졌으면(단계가 바뀔 때) 곧바로 숨긴다(예전에는 좌상단 0,0 으로 날아갔다).
function hideFinger(){ const f = $("#finger"); f.style.display = "none"; f.className = ""; }
function placeFinger(animate){ const f = $("#finger");
  // 사진은 그 자체가 주인공이라 테두리만 빛내고 손가락은 쓰지 않는다(제목을 가리지 않게)
  if(!pointed || !pointed.isConnected || !P.on || pointed.classList.contains("photo")) return hideFinger();
  const r = pointed.getBoundingClientRect();
  if(!r.width && !r.height) return hideFinger();
  const right = r.left > 70, x = right ? r.left - 60 : r.left + Math.min(r.width / 2, 80),
        y = right ? r.top + Math.min(r.height / 2, 40) - 24 : r.top - 56;
  const visible = f.style.display === "block", left = Math.round(x + scrollX), top = Math.round(Math.max(4, y + scrollY));
  // 이미 그 자리에 있으면 건드리지 않는다(애니메이션이 다시 시작되며 떨리지 않게)
  if(visible && Math.abs(parseFloat(f.style.left) - left) <= 2 && Math.abs(parseFloat(f.style.top) - top) <= 2) return;
  f.textContent = right ? "👉" : "👇";
  const cls = `${right ? "r" : "d"}${visible && animate ? " move" : " show"}`;
  if(f.className !== cls) f.className = cls;
  f.style.left = `${left}px`; f.style.top = `${top}px`;
  f.style.display = "block"; }
// 재생 중에는 대상이 움직였는지(내용이 늦게 그려져 밀림 등) 0.4초마다 보고 조용히 따라간다
setInterval(() => { if(P.on && pointed) placeFinger(true); }, 400);
function point(sel){ document.querySelectorAll(".spot").forEach(x => x.classList.remove("spot"));
  pointed = (sel && document.querySelector(sel)) || document.querySelector("#main .photo");
  if(!pointed) return hideFinger();
  pointed.classList.add("spot");
  // 말풍선(화면 아래)에 가리지 않게, 대상이 화면 위쪽 1/5 쯤 오도록 스크롤한다
  const top = pointed.getBoundingClientRect().top + scrollY - Math.max(70, innerHeight * 0.18);
  scrollTo({top:Math.max(0, top), behavior:"smooth"});
  placeFinger(true); }
addEventListener("resize", () => placeFinger(false));
function bubble(text, sub){ const b = $("#bubble"); if(text === null){ b.classList.remove("on"); return; }
  $("#bubble-text").textContent = text; $("#bubble-sub").textContent = sub || ""; b.classList.add("on"); b.classList.toggle("paused", P.paused); }
function speak(i, part, gen){ return new Promise(done => {
  const text = NARR[i]?.[part]; if(!text || gen !== P.gen) return done();
  point(NARR[i][part + "_point"]); bubble(text, `${i+1} / ${STEPS.length} · ${titleOf(i)}`);
  const finish = () => { P.audio = null; P.skip = null; done(); };
  const file = `${audioDir()}s${pad(i)}_${part}.mp3`, a = new Audio(CLIPS[file] === null ? "" : CLIPS[file] || file); a.playbackRate = P.rate; a.preservesPitch = true;
  P.audio = a; P.skip = () => { a.pause(); speechSynthesis?.cancel(); finish(); };
  a.onended = finish;
  const fallback = () => {          // 음성 파일이 없으면 브라우저 음성으로 읽는다
    if(!window.speechSynthesis) return setTimeout(finish, text.length * 90 / P.rate);
    const u = new SpeechSynthesisUtterance(text); u.lang = VOICE_LANG[LANG]; u.rate = P.rate; u.onend = finish; u.onerror = finish;
    P.audio = {pause: () => speechSynthesis.pause(), play: () => speechSynthesis.resume()}; speechSynthesis.speak(u); };
  a.onerror = fallback;
  const start = () => a.play().catch(fallback);
  P.paused ? (P.resume = start) : start(); }); }
async function autoplay(from){
  const gen = ++P.gen; P.skip?.(); P.on = true; P.paused = false; document.body.classList.add("playing"); playUi();
  if(!NARR.length) await loadLang();
  await preloadClips(); if(gen !== P.gen) return;
  for(let i = Math.max(0, from); i < STEPS.length; i++){
    if(gen !== P.gen) return;
    await go(i); await sleep(600); await waitResume(); if(gen !== P.gen) return;
    await speak(i, "intro", gen); if(gen !== P.gen) return;
    await waitResume(); if(gen !== P.gen) return;
    const p = pending();
    if(p){ bubble(ui("run"), `${i+1} / ${STEPS.length} · ${titleOf(i)}`); point(`[data-act="${p[0].dataset.act}"]`);
      await runAct(p[0]); if(gen !== P.gen) return; await sleep(500); }
    if(NARR[i]?.after){ await speak(i, "after", gen); if(gen !== P.gen) return; }
    await waitResume(); await sleep(800);
  }
  if(gen === P.gen){ P.on = false; pointed = null; hideFinger(); bubble(ui("end"), ""); playUi(); }
}
function stopPlay(){ P.gen++; P.skip?.(); P.on = false; P.paused = false; P.resume = null; pointed = null;
  document.querySelectorAll(".spot").forEach(x => x.classList.remove("spot")); hideFinger(); bubble(null);
  document.body.classList.remove("playing"); playUi(); }
function togglePause(){ if(!P.on) return autoplay(ctx.step);
  P.paused = !P.paused;
  if(P.paused){ P.audio?.pause(); }
  else { if(P.resume){ const r = P.resume; P.resume = null; r(); } else P.audio?.play(); }
  $("#bubble").classList.toggle("paused", P.paused); playUi(); }
function playUi(){ $("#bar-play").textContent = P.paused ? ui("cont") : ui("pause");
  if(P.on) $("#bar-hint").innerHTML = P.paused ? ui("hintPaused") : ui("hintPlay"); else bar(); }
// 시작 선택은 페이지 안 버튼으로 받는다. 브라우저는 '누른 그 순간'에만 전체 화면을 허락하므로
// (확인 창을 거치거나 초기화를 기다린 뒤에 요청하면 조용히 거부된다) 누르자마자 전체 화면부터 켠다.
function startPlay(){ $("#start").classList.add("on"); $("#start [data-start=fresh]").focus(); }
$("#play-on").onclick = startPlay;
$("#start").addEventListener("click", async e => {
  const b = e.target.closest("[data-start]"); if(!b && e.target.id !== "start") return;
  $("#start").classList.remove("on");
  const how = b ? b.dataset.start : "cancel"; if(how === "cancel") return;
  showOn();                                                  // 클릭 순간에 바로
  if(how === "fresh"){ bubble(ui("data"), ""); await api("/api/reset", {confirm:"RESET"});
    ctx = {step:0, done:{0:true}}; META = await api("/api/meta"); }
  autoplay(how === "fresh" ? 0 : ctx.step); });
// 누른 뒤 포커스를 풀어 둔다 — 남아 있으면 스페이스가 이 버튼도 한 번 더 눌러 멈췄다 바로 다시 재생된다
$("#bar-play").onclick = e => { e.currentTarget.blur(); togglePause(); };
$("#bar-rate").onchange = e => { P.rate = Number(e.target.value); if(P.audio && "playbackRate" in P.audio) P.audio.playbackRate = P.rate; };
document.addEventListener("keydown", e => {
  if(e.target.closest("input,select,textarea") || e.ctrlKey || e.altKey || e.metaKey) return;
  if($("#start").classList.contains("on")){ if(e.key === "Escape") $("#start").classList.remove("on"); return; }
  const show = document.body.classList.contains("show");
  if(P.on){                                   // 나레이션 진행 중
    if(e.key === " "){ e.preventDefault(); togglePause(); }
    else if(["ArrowRight","PageDown"].includes(e.key)){ e.preventDefault(); if(P.paused) togglePause(); P.skip?.(); }
    else if(["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); if(!busy) autoplay(ctx.step - 1); }
    else if(e.key === "Escape"){ stopPlay(); showOff(); }
    return; }
  if(["ArrowRight","PageDown"].includes(e.key) || (show && e.key === " ")){ e.preventDefault(); forward(); }
  else if(["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); if(!busy) go(ctx.step-1); }
  else if(e.key === "f" || e.key === "F"){ show ? showOff() : showOn(); }
  else if(e.key === "Escape" && show) showOff();
});
if(new URLSearchParams(location.search).has("show")) document.body.classList.add("show");   // ?show 로 바로 발표 모드(전체 화면은 F 키)
document.body.addEventListener("click", async e => {
  const go_ = e.target.closest("[data-go]"), act = e.target.closest("[data-act]"), pdf = e.target.closest("[data-pdf]");
  if(go_ && !go_.disabled) return P.on ? autoplay(Number(go_.dataset.go)) : go(Number(go_.dataset.go));
  if(act && !act.disabled) return runAct(act);
  if(pdf && !pdf.disabled){ const label = pdf.textContent; pdf.disabled = true; pdf.textContent = "만드는 중…";
    try{ const r = await api("/api/pdf", {kind:pdf.dataset.pdf, id:Number(pdf.dataset.id)}); window.open(r.url, "_blank"); ctx.done[6] = true; msg = ["ok", `${r.pages}쪽 PDF를 만들었습니다. 새 창이 안 열리면 주소창에 ${r.url} 을 넣으세요.`]; }
    catch(err){ msg = ["bad", err.message]; }
    return render(); }
});
$("#lang").onchange = async e => { if(P.on) stopPlay(); LANG = e.target.value;
  try{ localStorage.setItem("harubook-lang", LANG); }catch(err){} await loadLang(); META = await api("/api/meta"); render(); };
(async () => { await loadLang(); META = await api("/api/meta");
  if(ctx.sid){ try{ await api(`/api/students/${ctx.sid}`); }catch(e){ ctx = {step:0, done:{}}; } }   // DB가 초기화됐으면 처음부터
  render(); })().catch(e => { $("#main").innerHTML = `<div class="card">불러오지 못했습니다: ${esc(e.message)}</div>`; });
</script>
</body>
